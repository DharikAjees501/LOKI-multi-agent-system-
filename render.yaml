services:
  # 1. Backend Web Service (FastAPI)
  - type: web
    name: swarmlens-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: swarmlens-db
          property: connectionString
      - key: CORS_ORIGINS
        value: '["*"]'
      - key: LOG_LEVEL
        value: INFO

  # 2. Frontend Web Service (Next.js)
  - type: web
    name: swarmlens-frontend
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 20.17.0
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: swarmlens-backend
          property: host
        # Render will populate https://${HOST}/api

databases:
  # 3. Managed PostgreSQL Database
  - name: swarmlens-db
    databaseName: swarmlens_db
    user: swarmlens
    plan: free

